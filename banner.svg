<?xml version="1.0" encoding="UTF-8"?>
<!--
  anlibili Android TV 横幅（320 × 180），由 icon.svg 的设计语言延伸。
  生成：rsvg-convert -w 320 -h 180 banner.svg -o /tmp/banner.png
        magick /tmp/banner.png -quality 92 app/src/main/res/drawable/ic_banner.webp
-->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131A"/>
      <stop offset="1" stop-color="#1B2030"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>

  <g transform="translate(24 46) scale(0.172)">
    <path d="M150 172 L150 340 L292 256 Z" fill="#FB7299"/>
    <rect x="330" y="170" width="100" height="36" rx="18" fill="#FFFFFF"/>
    <rect x="330" y="238" width="100" height="36" rx="18" fill="#FFFFFF"/>
    <rect x="330" y="306" width="100" height="36" rx="18" fill="#FFFFFF"/>
  </g>

  <text x="130" y="98" fill="#FFFFFF" font-family="DejaVu Sans, Noto Sans, sans-serif"
        font-size="38" font-weight="bold" letter-spacing="1">anlibili</text>
  <text x="131" y="124" fill="#FB7299" font-family="DejaVu Sans, Noto Sans, sans-serif"
        font-size="15" letter-spacing="2">精选 B 站视频</text>
</svg>
