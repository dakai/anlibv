<?xml version="1.0" encoding="UTF-8"?>
<!--
  anlibili 图标源文件（512 × 512）。
  设计：深色圆角底 + 粉色播放三角形 + 右侧三条白色列表条，表达「播放 / 精选列表」。

  重新生成 Android 资源（需要 rsvg-convert 与 ImageMagick）：
    for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
      size=${d##*:}; dens=${d%%:*}
      rsvg-convert -w $size -h $size icon.svg -o /tmp/icon-$size.png
      magick /tmp/icon-$size.png -quality 92 \
        app/src/main/res/mipmap-$dens/ic_launcher.webp
      magick /tmp/icon-$size.png -alpha set \
        \( -size ${size}x${size} xc:none -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),0" \) \
        -compose DstIn -composite -quality 92 \
        app/src/main/res/mipmap-$dens/ic_launcher_round.webp
    done
    rsvg-convert -w 320 -h 180 banner.svg -o /tmp/banner.png
    magick /tmp/banner.png -quality 92 app/src/main/res/drawable/ic_banner.webp

  小尺寸（48dp）下三角形与列表条仍可分辨，因此不再加入渐变与描边细节。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#10131A"/>
  <path d="M150 172 L150 340 L292 256 Z" fill="#FB7299"/>
  <rect x="330" y="170" width="100" height="36" rx="18" fill="#FFFFFF"/>
  <rect x="330" y="238" width="100" height="36" rx="18" fill="#FFFFFF"/>
  <rect x="330" y="306" width="100" height="36" rx="18" fill="#FFFFFF"/>
</svg>
